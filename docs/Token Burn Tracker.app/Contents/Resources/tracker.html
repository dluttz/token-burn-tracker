        <span class="field"><label for="src-keys">Token field or fields</label><input class="input" id="src-keys" placeholder="total_tokens, or prompt_tokens,completion_tokens"></span>
        <span class="field"><label for="src-ts">Timestamp field</label><input class="input" id="src-ts" placeholder="optional, for example timestamp"></span>
        <span class="field"><label for="src-rate">Rate, USD per million</label><input class="input" id="src-rate" type="number" min="0" step="any" placeholder="optional, for example 3"></span>
        <span class="field"><label for="src-proc">Process name</label><input class="input" id="src-proc" placeholder="optional, for example aider"></span>
        <span style="grid-column:1/-1;display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap">
          <button class="btn btn-primary" data-act="addsource">Add tool</button>
          <span class="muted" style="font-size:12.5px">${esc(st("src"))}</span>
        </span>
      </div>`:""}

     <hr class="hr" style="margin:var(--s8) 0 var(--s4)">
     <h4 style="margin:0 0 var(--s2)">Appearance</h4>
     <p style="max-width:66ch;margin:0 0 var(--s3);font-size:14px">One accent drives every rule, tint and chart on the page, including every status and severity mark. Ground and accent are yours to pick; everything else follows. Both are shared with the desktop widget.</p>
     <div style="display:flex;gap:var(--s6);flex-wrap:wrap;align-items:flex-start">
       <span class="field"><label>Ground</label><span class="seg">${grounds}</span></span>
       <span class="field"><label>Accent</label><span style="display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap">${accents}
         <input type="color" id="accent-custom" value="${attr(S.accent)}" data-act="setaccentcustom" title="Any other colour"
           style="width:24px;height:24px;padding:0;border:1px solid var(--rule);border-radius:50%;background:none;cursor:pointer"></span></span>
       <span class="field"><label>Dollar equivalents</label><span class="seg">${usdOpts}</span></span>
     </div>

     <hr class="hr" style="margin:var(--s8) 0 var(--s4)">
     <h4 style="margin:0 0 var(--s2)">Prices</h4>
     <p style="max-width:68ch;margin:0 0 var(--s3);font-size:14px">Dollar figures use public API list prices from LiteLLM's community sheet, refreshed in the background about once a day. If the fetch fails it fails silently and the old rates keep working, so the age below is worth a glance.</p>
     <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap">
       <span class="muted num" style="font-size:13px">${(()=>{const c=S.costs||{};
         if(c.pricesAgeHours==null) return "Using the bundled offline rates.";
         const h=+c.pricesAgeHours;
         return "Sheet refreshed "+(h<1?"under an hour":(h<48?Math.round(h)+" h":Math.round(h/24)+" days"))+" ago.";})()}</span>
       <button class="btn btn-secondary btn-sm" data-act="refreshprices">Refresh prices now</button>
       <span class="muted" style="font-size:12.5px">${esc(st("prices"))}</span>
     </div>

     ${widgetBlock}
     ${updateBlock}

     <hr class="hr" style="margin:var(--s8) 0 var(--s4)">
     <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap">
       <button class="btn btn-secondary" data-act="rescan">Rescan the logs now</button>
       <span class="muted" style="font-size:12.5px">${esc(st("rescan")||"It rescans on its own every few minutes.")}</span>
     </div>
     <p class="muted" style="max-width:78ch;margin:var(--s6) 0 0;font-size:12.5px">
       Scanned ${esc(nfmt(d.files||0))} log files. Token counts include input, output and cache tokens.
       Local-first: your prompts and chats never leave your Mac. Anonymous, aggregate usage stats (app version and error counts, never prompt or chat content) help fix crashes; opt out with TOKENBURN_ANALYTICS=off.
       Dollar figures are an API-list-price equivalent, never a bill: subscription plans do not charge per token.
       ${esc(d.generatedAt?("Last read "+String(d.generatedAt).replace("T"," ")+"."):"")}
     </p>`);
}
</script>
<script>
/* ===========================================================================
   Rendering, routing, events, polling
   ======================================================================== */
S.form = {};
const VIEWS=["today","where","fixes","coach","settings"];
function viewEl(v){ return document.getElementById("view-"+v); }
function typingIn(v){
  const el=viewEl(v), a=document.activeElement;
  if(!el||!a) return false;
  if(!/^(INPUT|TEXTAREA)$/.test(a.tagName)) return false;
  return el.contains(a);
}
function renderChrome(){
  document.querySelectorAll(".nav a.tab").forEach(a=>{
    if(a.dataset.view===S.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  VIEWS.forEach(v=>viewEl(v).classList.toggle("on", v===S.view));
  const b=$("#burnread"), bv=$("#burnread-v"), pm=burnPerMin();
  if(b&&bv){ b.hidden=!(S.live&&S.live.burn); bv.textContent=fmt(pm); }
  const rc=$("#rescan-chip"), rt=$("#rescan-text");
  const loading=!!(S.data&&S.data.loading);
  /* A spinner with no timeout is a lie waiting to happen. If this tab stops getting answers,
     whether the server went away or the page itself wedged, the old chip just sat there saying
     "Rescanning" forever over numbers that were minutes stale. Anything past two minutes without
     a successful read now says so and tells you what to do about it. */
  /* The threshold has to clear the slowest poll that stamps lastOkAt, or the chip cries wolf
     just before every scheduled refresh. /api/live stamps it every 8 seconds, so 90 seconds of
     silence means this tab genuinely stopped being answered. */
  const age=S.lastOkAt ? (Date.now()-S.lastOkAt)/1000 : null;
  const stale = age!=null && age>90;
  if(rc){
    rc.hidden = !(loading||stale);
    if(rt){
      if(stale) rt.textContent=`Not updating for ${Math.round(age/60)} min · reload the page`;
      else if(loading) rt.textContent=`Rescanning, ${nfmt((S.data&&S.data.parsed)||0)} of ${nfmt((S.data&&S.data.files)||0)} files`;
      else rt.textContent="Rescanning";   // reset, or a cleared warning sticks around
    }
    rc.classList.toggle("stale", !!stale);
  }
}
function render(only){
  renderChrome();
  const v=only||S.view;
  if(only && only!==S.view) return;
  if(typingIn(v) && (v==="settings"||v==="fixes"||v==="coach")) return;
  if(v==="today"){ if(renderToday()) wireChart(); }
  else if(v==="where") renderWhere();
  else if(v==="fixes"){ if(renderFixes()) restoreForm(); }
  else if(v==="coach"){ if(renderCoach()) restoreForm(); }
  else if(v==="settings"){ if(renderSettings()) restoreForm(); }
}
function renderIfVisible(v){ if(S.view===v) render(v); }
const LASTHTML={};
function hasLiveSelection(el){
  try{
    const sel=window.getSelection();
    if(!sel || sel.isCollapsed || !sel.rangeCount) return false;
    return el.contains(sel.anchorNode) || el.contains(sel.focusNode);
  }catch(e){ return false; }
}
function setViewHTML(v, html){
  const el=viewEl(v);
  if(LASTHTML[v]===html) return false;            // nothing changed: leave the DOM alone
  if(v===S.view && hasLiveSelection(el)){ S.pendingRender=true; return false; }   // never yank a selection
  LASTHTML[v]=html; el.innerHTML=html;
  return true;
}
document.addEventListener("selectionchange", ()=>{
  const sel=window.getSelection();
  if(S.pendingRender && (!sel || sel.isCollapsed)){ S.pendingRender=false; render(); }
});
function restoreForm(){
  Object.keys(S.form).forEach(id=>{ const el=document.getElementById(id); if(el && el.value!==S.form[id]) el.value=S.form[id]; });
}
function renderChartOnly(){
  const box=$("#chartbox"); if(!box) return;
  if(hasLiveSelection(viewEl("today"))) return;   // a hover redraw never outranks a selection
  box.innerHTML=chartHTML(); delete LASTHTML.today; wireChart();
}
function wireChart(){
  const svg=document.querySelector("#chartbox svg.chartsvg"); if(!svg) return;
  const cs=chartSeries(); if(!cs.vals.length) return;
  svg.addEventListener("mousemove", e=>{
    const r=svg.getBoundingClientRect();
    const i=Math.round((e.clientX-r.left)/Math.max(1,r.width)*(cs.vals.length-1));
    const c=Math.max(0,Math.min(cs.vals.length-1,i));
    if(c!==S.hover){ S.hover=c; renderChartOnly(); }
  });
  svg.addEventListener("mouseleave", ()=>{ if(S.hover!==null){ S.hover=null; renderChartOnly(); } });
}

/* ---------- routing ---------- */
function setView(v){
  if(VIEWS.indexOf(v)<0) v="today";
  S.view=v;
  if(v==="where") loadLeaks();   // titles re-resolve server-side, so renames land on open
  if(v==="coach") setTimeout(()=>{ const t=$("#coach-input"); if(t) t.focus(); }, 60);
  if(location.hash.slice(1)!==v){ try{ history.replaceState(null,"","#"+v); }catch(e){ location.hash=v; } }
  render();
  window.scrollTo({top:0,behavior:"auto"});
}
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(VIEWS.indexOf(h)>=0 && h!==S.view) setView(h); });

/* ---------- actions ---------- */
function askAction(id){ S.asking[id]=true; render(); }
function cancelAction(id){ delete S.asking[id]; render(); }
async function runAction(id){
  delete S.asking[id];
  S.busy[id]=true; render();
  let res, label="";
  const burnThen=burnPerMin();
  try{
    if(id.indexOf("leak-")===0){
      const c=(leaksNow()&&leaksNow().chats||[])[+id.slice(5)]||null;
      label="Copied the compact prompt"+(c?` for “${clip(chatLabel(c),48)}”`:"");
      const ok=await copyText(HANDOFF,"Copied the compact prompt");
      res = ok ? {ok:true, message:"Copied."} : {ok:false, message:"Could not reach the clipboard.", next:"Select the prompt in Fixes and copy it by hand."};
    } else {
      const a=actionById(id);
      label=(a&&a.title)||"";
      if(!a || !a.run){ res={ok:false, message:"That row is no longer available.", next:"Rescan the logs and try again."}; }
      else res=await a.run();
    }
  }catch(e){ res={ok:false, message:"Something went wrong on this Mac.", next:"Nothing was changed. Try again in a moment."}; }
  delete S.busy[id];
  S.ran[id]=res;
  if(res && res.ok) S.ledger.push({t:Date.now(), label, msg:res.message||"", burnThen});
  render();
  if(res && res.ok){ pollLive(); pollLeftovers(true); }
}
function unhideAll(){ S.dismissed={}; S.snoozed={}; render(); }

/* ---------- click / change delegation ---------- */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.tagName==="INPUT") return;                 // radios and colour inputs use change/input
  const act=el.dataset.act, v=el.dataset.v, id=el.dataset.id, k=el.dataset.k;
  switch(act){
    case "setview":   e.preventDefault(); setView(v); break;
    case "pinspan":   S.spanAuto=false; break;
    case "toggle":    S.open[k]=!S.open[k]; render(); break;
    case "reveal":    S.open[k]=!S.open[k]; render(); break;
    case "fixask":    askAction(id); break;
    case "fixcancel": cancelAction(id); break;
    case "fixgo":     runAction(id); break;
    case "fixdismiss":S.dismissed[id]=true; delete S.asking[id]; render(); toast("Hidden for this session"); break;
    case "fixsnooze": S.snoozed[id]=Date.now()+3600000; delete S.asking[id]; render(); toast("Snoozed for an hour"); break;
    case "unhide":    unhideAll(); break;
    case "calpick":   S.pickDay = (S.pickDay===v?null:v); render(); break;
    case "copy":      copyText(el.dataset.copy||"", "Copied"); break;
    case "setcap":    doSetCap(); break;
    case "clearcap":  S.cap=null; S.form["cap-input"]=""; S.status.cap="Cleared. Today measures against your own heaviest five hours again."; render(); break;
    case "addsource": doAddSource(); break;
    case "rmsource":  doRemoveSource(v); break;
    case "rescan":    doRescan(); break;
    case "refreshprices": doRefreshPrices(); break;
    case "widget":    doWidget(); break;
    case "coachrun":  doCoach(); break;
    case "showupdate":showUpdateModal(); break;
  }
});
document.addEventListener("change", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==="setspan"){ S.span=v; S.spanAuto=false; S.hover=null; renderChartOnly(); if(S.span==="day") loadSeries("1d"); }
  else if(act==="setcut"){ S.cut=v; render(); }
  else if(act==="setleakwin"){ S.leakWin=v; loadLeaks(); render(); }
  else if(act==="setground"){ setGround(v); }
  else if(act==="setusd"){ S.showUsd=(v==="true"); render(); }
  else if(act==="setaccent"){ setAccent(v); }
  else if(act==="setaccentcustom"){ setAccent(el.value); }
});
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter" && e.target && e.target.id==="coach-input") doCoach();
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id) S.form[el.id]=el.value;
  if(el.dataset && el.dataset.act==="setaccentcustom") setAccent(el.value);
});

/* ---------- theme ---------- */
function setAccent(c){
  if(!/^#[0-9a-fA-F]{6}$/.test(c)) return;
  S.accent=c; window.__tbAccent(c);
  fetch("/api/theme",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accent:c})}).catch(()=>{});
  render();
}
function setGround(g){
  S.ground=g; const p=GROUND[g]||GROUND.light;
  window.__tbPrimary(p);
  fetch("/api/theme",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({primary:p})}).catch(()=>{});
  render();
}
window.__tbAccentChanged=c=>{ S.accent=c; renderIfVisible("settings"); };
window.__tbGroundChanged=p=>{ S.ground=window.__tbThemeOf(p); renderIfVisible("settings"); };

/* ---------- settings actions ---------- */
function doSetCap(){
  const raw=(S.form["cap-input"]||"").replace(/[^0-9]/g,"");
  const n=parseInt(raw,10);
  if(!n || n<1000){ S.status.cap="Enter the number of tokens in one five-hour window, for example 8,000,000."; render(); return; }
  S.cap=n; S.form["cap-input"]=nfmt(n);
  S.status.cap="Saved for this session. Today now measures against your cap.";
  render();
}
async function doAddSource(){
  S.status.src="Saving…"; render();
  const g=id=>(S.form[id]||(document.getElementById(id)&&document.getElementById(id).value)||"");
  try{
    const r=await apiPOST("/api/add_source",{name:g("src-name"), glob:g("src-glob"), tokenKeys:g("src-keys"),
      tsKeys:g("src-ts"), rate:g("src-rate"), process:g("src-proc")});
    if(r&&r.ok){ S.status.src=srv(r.message||"Added. Rescanning now."); ["src-name","src-glob","src-keys","src-ts","src-rate","src-proc"].forEach(i=>{S.form[i]="";});
      setTimeout(loadData,1400); }
    else S.status.src=srv((r&&r.error)||"Could not add it. Nothing was changed.");
  }catch(e){ S.status.src="Could not reach the tracker. Nothing was changed."; }
  render();
}
async function doRemoveSource(name){
  S.status.src=`Removing “${name}”. Your log files are not touched.`; render();
  try{ await apiPOST("/api/remove_source",{name}); S.status.src=`Stopped tracking “${name}”. Your log files were not touched.`; setTimeout(loadData,1000); }
  catch(e){ S.status.src="Could not reach the tracker. Nothing was changed."; }
  render();
}
async function doRefreshPrices(){
  S.status.prices="Fetching…"; render();
  try{
    const r=await apiPOST("/api/refresh_prices");
    S.status.prices = (r&&r.ok) ? srv(r.message||"Refreshed.") : srv((r&&r.error)||"Could not refresh. The old rates keep working.");
    if(r&&r.ok) await loadCosts();
  }catch(e){ S.status.prices="Could not reach the tracker. The old rates keep working."; }
  render();
}
async function doRescan(){
  S.status.rescan="Rescanning…"; render();
  try{ await apiJSON("/api/refresh"); }catch(e){}
  setTimeout(async()=>{ await loadData(); S.status.rescan="Done."; render(); }, 800);
  try{ const u=await apiJSON("/api/checkupdate"); S.update=u; if(u&&u.outdated) showUpdateModal(); }catch(e){}
}
async function doWidget(){
  S.status.widget="Working…"; S.status.widgetfail=""; render();
  try{
    const r=await apiPOST("/api/install_widget");
    if(r&&r.ok){ S.widget=r; S.status.widget="Added. Look at your desktop."; }
    else { if(r&&typeof r.ubersichtInstalled!=="undefined") S.widget=r; S.status.widget=""; S.status.widgetfail="1"; }
  }catch(e){ S.status.widget=""; S.status.widgetfail="1"; }
  render();
}
async function doCoach(){
  const prompt=(S.form["coach-input"]||($("#coach-input")&&$("#coach-input").value)||"").trim();
  if(!prompt){ S.coach={ok:false, error:"Paste a prompt first."}; render(); return; }
  S.coachBusy=true; render();
  try{ S.coach=await apiPOST("/api/prompt_check",{prompt}); }
  catch(e){ S.coach={ok:false, error:"Could not reach the tracker."}; }
  S.coachBusy=false; render(); restoreForm();
}

/* ---------- update modal ---------- */
function showUpdateModal(){
  const u=S.update; if(!u||!u.outdated) return;
  $("#um-current").textContent=u.current||"?";
  $("#um-latest").textContent=u.latest||"?";
  $("#um-cmd").textContent=u.cmd||"";
  $("#update-modal").classList.remove("hidden");
}
function hideUpdateModal(){ $("#update-modal").classList.add("hidden"); S.updateDismissed=true; }
$("#um-later").addEventListener("click", hideUpdateModal);
$("#update-modal").addEventListener("click", e=>{ if(e.target===$("#update-modal")) hideUpdateModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideUpdateModal(); });
$("#um-copy").addEventListener("click", ()=>copyText($("#um-cmd").textContent||"", "Copied the update command"));
$("#um-now").addEventListener("click", async ()=>{
  const btn=$("#um-now"), st=$("#um-status");
  btn.disabled=true; btn.textContent="Updating…"; st.textContent="Downloading the latest version…";
  let r=null;
  try{ r=await apiPOST("/api/applyupdate"); }catch(e){ r=null; }
  if(!r||!r.ok){
    btn.disabled=false; btn.textContent="Update now";
    st.textContent=((r&&r.message)?r.message:"Could not update automatically.")+" Nothing was changed. Use the manual command below.";
    return;
  }
  st.textContent="Installing and restarting…";
  await new Promise(res=>setTimeout(res,3200));
  let tries=0;
  const poll=setInterval(async()=>{
    tries++;
    let up=false;
    try{ up=(await fetch("/api/summary",{cache:"no-store"})).ok; }catch(e){}
    if(up){ clearInterval(poll); st.textContent="Updated. Reloading…"; setTimeout(()=>location.reload(),700); }
    else if(tries>40){ clearInterval(poll); st.textContent="Updated. Refresh the page to see it."; }
  },1000);
});

/* ---------- loaders ---------- */
async function loadData(){
  let d;
  try{ d=await apiJSON("/api/data"); }
  catch(e){ return; }
  if(d && (d.days || d.grand!=null || !S.data)) S.data=d;      // keep the last good payload during a rescan
  S.lastOkAt=Date.now();                                        // proof this tab is still being answered
  if(d && d.update && !S.update) S.update=d.update;
  if(d && d.update && d.update.outdated && !S.updateDismissed && !S.booted) showUpdateModal();
  render();
  if(d && d.loading) setTimeout(loadData, 2000);
}
async function loadCosts(){
  try{
    const c=await apiJSON("/api/costs");
    if(c && !c.error){ S.costs=c; BLENDED_RATE = +c.blendedRate || computeBlendedRate(c.tokenBreakdown); }
  }catch(e){}
  render();
}
async function loadLeaks(){
  try{ S.leaks=await apiJSON("/api/leaks?days="+encodeURIComponent(S.leakWin)); }catch(e){}
  try{ S.leaksAll = S.leakWin==="all" ? S.leaks : await apiJSON("/api/leaks?days=all"); }catch(e){}
  renderIfVisible("where"); renderIfVisible("today"); renderIfVisible("fixes");
}
async function loadSeries(range){
  try{ S.series[range]=await apiJSON("/api/series?range="+encodeURIComponent(range)); }catch(e){}
  renderIfVisible("today");
}
async function pollLive(){
  try{
    const d=await apiJSON("/api/live");
    S.live=d;
    S.lastOkAt=Date.now();   // this tab is being answered; the staleness guard keys off it
    const pm=Math.max(0,Math.round((d.burn&&d.burn.perMin)||0));
    if(!S.sampleStart) S.sampleStart=Date.now();
    S.lastSampleT=Date.now();
    S.liveSamples.push(pm);
    if(S.liveSamples.length>LIVE_SAMPLES_MAX) S.liveSamples=S.liveSamples.slice(-LIVE_SAMPLES_MAX);
    // the page opens on the (already full) 24h view; hop to the live view
    // once it has about 90 seconds of readings, unless the user chose a span
    if(S.spanAuto && S.span==="day" && S.liveSamples.length>=12){ S.span="live"; S.hover=null; }
  }catch(e){}
  renderChrome();
  renderIfVisible("today"); renderIfVisible("fixes");
}
let __loLast=0;
async function pollLeftovers(force){
  if(!force && Date.now()-__loLast<30000) return;
  __loLast=Date.now();
  try{ S.leftovers=await apiJSON("/api/leftovers"); }catch(e){}
}
async function pollAgents(){
  try{ S.agents=await apiJSON("/api/agents"); }catch(e){}
  renderIfVisible("today");
}

/* ---------- boot ---------- */
(async function boot(){
  const h=location.hash.slice(1);
  S.view = VIEWS.indexOf(h)>=0 ? h : "today";
  S.accent = window.__tbSyncedAccent ? window.__tbSyncedAccent() : "#9c2a2c";
  S.ground = document.documentElement.dataset.theme || "light";
  render();
  await loadData();
  S.booted=true;
  loadCosts(); loadLeaks(); loadSeries("5d"); loadSeries("1d");
  pollLive(); pollAgents(); pollLeftovers(true);
  apiJSON("/api/widget").then(w=>{ S.widget=w; renderIfVisible("settings"); }).catch(()=>{});
  setInterval(()=>{ if(document.hidden) return; pollLive(); pollAgents(); pollLeftovers(); }, 8000);
  setInterval(()=>{ if(document.hidden) return; loadSeries("5d"); loadSeries("1d"); loadCosts(); }, 60000);
  setInterval(()=>{ if(document.hidden) return; loadLeaks(); loadData(); }, 120000);
  /* renderChrome only, on its own timer: the staleness warning has to appear even when the
     thing that broke is whatever normally triggers a render. */
  setInterval(()=>{ try{ renderChrome(); }catch(e){} }, 15000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden) return;
    // sampling paused while hidden, so a long gap would splice hour-old
    // readings next to fresh ones with made-up timestamps: start the live
    // series over and fall back to the (always complete) 24h view meanwhile
    if(S.lastSampleT && Date.now()-S.lastSampleT>30000){
      S.liveSamples=[]; S.sampleStart=0;
      if(S.spanAuto) S.span="day";
    }
    pollLive(); pollAgents(); pollLeftovers(true);
    loadSeries("5d"); loadSeries("1d"); loadCosts(); loadLeaks(); loadData();
  });
})();
</script>
</body>
</html>
