<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Burn · live</title>
<style>
/* ============================================================================
   Token Burn Tracker: one file, no framework, no build step, no CDN.
   Every colour that carries meaning is derived from --accent / --accent-rgb so
   the accent picker re-themes the whole page, including severity and status.
   ========================================================================= */
:root{
  --accent:#9c2a2c; --accent-rgb:156,42,44;

  --bg:#f3f2f2; --surface:#eae9e9; --ink:#201f1d;
  --rule:rgba(32,31,29,.16); --rule-soft:rgba(32,31,29,.09);
  --muted:rgba(32,31,29,.58); --faint:rgba(32,31,29,.42);
  --hover:rgba(32,31,29,.05);
  --shadow-sm:0 1px 2px rgba(45,43,43,.14);
  --shadow-md:0 3px 10px rgba(45,43,43,.16);
  --shadow-lg:0 12px 32px rgba(45,43,43,.22);

  --font-heading:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",ui-serif,Georgia,serif;
  --font-body:ui-serif,"New York",Georgia,"Iowan Old Style","Times New Roman",serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --s1:4.6px; --s2:9.2px; --s3:13.8px; --s4:18.4px; --s6:27.6px; --s8:36.8px;
  --r-sm:2px; --r-md:4px; --r-lg:7px;
}
html[data-theme="dark"]{
  --bg:#1a1918; --surface:#242221; --ink:#f0ebe4;
  --rule:rgba(240,235,228,.20); --rule-soft:rgba(240,235,228,.11);
  --muted:rgba(240,235,228,.62); --faint:rgba(240,235,228,.44);
  --hover:rgba(240,235,228,.07);
  --shadow-sm:0 1px 2px rgba(0,0,0,.40);
  --shadow-md:0 3px 10px rgba(0,0,0,.46);
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
html[data-theme="soft"]{
  --bg:#e9ebf0; --surface:#e9ebf0; --ink:#3d414a;
  --rule:rgba(61,65,74,.14); --rule-soft:rgba(61,65,74,.08);
  --muted:rgba(61,65,74,.60); --faint:rgba(61,65,74,.44);
  --hover:rgba(61,65,74,.05);
  --soft-d:#c9ccd6; --soft-l:#fdffff;
  --shadow-sm:3px 3px 7px var(--soft-d),-3px -3px 7px var(--soft-l);
  --shadow-md:6px 6px 14px var(--soft-d),-6px -6px 14px var(--soft-l);
  --shadow-lg:12px 12px 28px var(--soft-d),-12px -12px 28px var(--soft-l);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:600;line-height:1.14;letter-spacing:-.015em;margin:0 0 var(--s2)}
h1{font-size:44px;font-weight:400}
.hero-h1{font-size:52px;max-width:24ch;margin:var(--s4) 0 0}
h4{font-size:20px}
h6{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
p{margin:0 0 var(--s3)}
a{color:var(--accent);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
::selection{background:rgba(var(--accent-rgb),.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px;border:3px solid transparent;background-clip:content-box}
@keyframes tbbreath{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
@keyframes tbrise{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tbspin{to{transform:rotate(360deg)}}
.rise{animation:tbrise .3s ease-out}
.hr{height:1px;border:0;margin:var(--s4) 0;background:var(--rule)}

/* ---------------- nav ---------------- */
.nav{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s8);
  border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:50;background:var(--bg);flex-wrap:wrap;row-gap:var(--s2)}
.nav-brand{font-family:var(--font-heading);font-weight:600;font-size:18px;display:flex;align-items:center;gap:9px;flex:none}
.nav-brand .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.nav a.tab{color:inherit;text-decoration:none;font-size:14px;cursor:pointer;padding:2px 0;border-bottom:1px solid transparent;white-space:nowrap}
.nav a.tab:hover{color:var(--accent)}
.nav a.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.nav .navright{margin-left:auto;display:flex;align-items:center;gap:var(--s3);flex:none;flex-wrap:wrap;row-gap:var(--s1)}
.burnread{display:flex;align-items:center;gap:var(--s2);font-size:13px;white-space:nowrap}
.burnread .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:tbbreath 3.4s ease-in-out infinite;flex:none}
/* [hidden] is only a UA-stylesheet rule, so ANY author "display" declaration silently beats it.
   .rescanchip set display:inline-flex, which meant the chip rendered permanently no matter what
   el.hidden was set to: the JS said hidden, the screen said "Rescanning" forever. One global
   rule so this cannot happen to any other element on the page either. */
[hidden]{display:none !important}
.rescanchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.rescanchip .sp{width:11px;height:11px;border:1.5px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:tbspin .8s linear infinite;flex:none}
.demopill{font-size:11.5px;padding:3px 10px;border-radius:var(--r-md);border:1px solid var(--accent);color:var(--accent);white-space:nowrap}

main{max-width:1240px;margin:0 auto;padding:var(--s8) var(--s8) 96px}
.view{display:none}
.view.on{display:block}

/* ---------------- buttons + forms ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:600;font-size:14px;line-height:1.2;color:var(--ink);
  background:transparent;border:1px solid transparent;padding:var(--s2) calc(var(--s3)*1.2);border-radius:var(--r-md);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--accent);border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:rgba(var(--accent-rgb),.12)}
.btn-secondary{border-color:var(--rule)}
.btn-secondary:hover:not(:disabled){background:var(--hover)}
.btn-ghost{color:var(--accent);padding-inline:var(--s1);border:0;background:transparent}
.btn-ghost:hover:not(:disabled){background:rgba(var(--accent-rgb),.10)}
.btn-sm{font-size:13px;padding:5px 10px}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:var(--muted);font-family:var(--font-ui)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--ink);
  caret-color:var(--accent);background:transparent;border:1px solid var(--rule);border-radius:var(--r-md)}
.input:hover{border-color:var(--muted)}
.input:focus-visible{border-color:var(--accent);outline-offset:0}
textarea.input{min-height:92px;resize:vertical;line-height:1.5}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-md);flex:none;max-width:100%;flex-wrap:wrap}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg-opt+.seg-opt{border-left:1px solid var(--rule)}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-opt:has(input:checked){color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg-opt:not(:has(input:checked)):hover{background:var(--hover)}
.seg-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

/* ---------------- cards, tags, tables ---------------- */
.card{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border-radius:var(--r-md);
  background:transparent;border:1px solid var(--rule)}
.card-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-family:var(--font-ui);font-weight:600}
.card-title{font-family:var(--font-heading);font-weight:600;font-size:17px;line-height:1.2}
.elev-sm{box-shadow:var(--shadow-sm)}
html[data-theme="soft"] .card{border:none;box-shadow:var(--shadow-sm)}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;
  border-radius:3px;font-family:var(--font-ui);white-space:nowrap}
.tag-accent{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.tag-neutral{background:var(--hover);color:var(--muted)}
.tag-outline{border:1px solid var(--accent);color:var(--accent)}
.tag-quiet{border:1px solid var(--rule);color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:var(--s2);border-bottom:1px solid var(--rule);font-family:var(--font-ui);font-weight:600}
.table td{padding:var(--s2);border-bottom:1px solid var(--rule);vertical-align:top}
.table tbody tr:hover{background:var(--hover)}
.tablewrap{overflow-x:auto}
.table.fixed{table-layout:fixed;min-width:620px}
.note{max-width:80ch;margin:var(--s4) 0 0;font-size:14px;border-left:1px solid var(--accent);padding-left:var(--s3)}
.subtle{font-size:12.5px;color:var(--muted)}
.rowlist{border-top:1px solid var(--rule)}
.rowlist>.r{border-bottom:1px solid var(--rule)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
sup.fn{font-size:9px;font-weight:700;opacity:.55;margin-left:1px;vertical-align:super;letter-spacing:0}
.fnote{display:grid;grid-template-columns:14px 1fr;gap:2px var(--s3);align-items:baseline;margin-top:var(--s3)}
.fnote .n{font-size:11px;font-weight:700;opacity:.55;font-variant-numeric:tabular-nums}
.fnote .f{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;opacity:.75}
/* --- leak board rows --- */
.lrow{display:flex;align-items:center;gap:var(--s8);padding:var(--s6) 0;border-bottom:1px solid var(--rule)}
.lboard{margin-top:var(--s7);border-top:1px solid var(--rule)}
.lrow:last-of-type{border-bottom:none}
.lmain{flex:1 1 auto;min-width:0}
.lnums{flex:0 0 auto;display:flex;align-items:center;gap:30px;padding-left:var(--s6)}
.lnums .big{font-variant-numeric:tabular-nums;font-size:21px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;text-align:right}
.lnums>div:first-child{min-width:196px}
.lnums .bigsub{font-size:11px;text-align:right;margin-top:1px;white-space:nowrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:66px}
.stat .k{font-size:9px;text-transform:uppercase;letter-spacing:.07em;opacity:.5;font-weight:700;white-space:nowrap}
.stat .v{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:600;margin-top:1px}
/* horizontal, swipeable tool strip */
.tools{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:1px 0 4px;margin-top:8px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.tools::-webkit-scrollbar{height:5px}
.tools::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.tools .tl{flex:0 0 auto;scroll-snap-align:start;display:inline-flex;align-items:baseline;gap:4px;
  padding:2px 8px;border:1px solid var(--rule);border-radius:999px;font-size:11px;cursor:help;white-space:nowrap;opacity:.8}
.tools .tl:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.tools .tl b{font-variant-numeric:tabular-nums;font-weight:700;opacity:.55;font-size:10px}
@media (max-width:900px){.lrow{flex-wrap:wrap}.lnums{width:100%;justify-content:flex-end}}
/* Real tooltips. Native title= is slow, never fires on touch, and in testing simply did not
   appear at all. This one lives on <body> so it escapes the tool strip's overflow clipping,
   which would cut off any absolutely-positioned tooltip inside that scroller. */
#tt{position:fixed;z-index:9999;max-width:340px;padding:9px 11px;border-radius:8px;
  background:#1f1f1f;color:#fff;font-size:12.5px;line-height:1.45;
  box-shadow:0 6px 24px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .09s;
  white-space:pre-wrap}
#tt.on{opacity:1}
[data-tip]{cursor:help}
.rescanchip.stale{color:var(--accent)}
.rescanchip.stale .sp{animation:none;opacity:.5}
.linky{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linky:hover{text-decoration-color:var(--accent);color:var(--accent)}

/* ---------------- today ---------------- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin:var(--s6) 0 0;margin-left:-1px}
.figs .fig{padding:var(--s3) var(--s4);border-left:1px solid var(--rule);min-width:0}
.figs .fig .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-ui);font-weight:600}
.figs .fig .val{font-family:var(--font-heading);font-size:27px;font-weight:400;line-height:1.15;margin-top:var(--s1)}
.figs .fig .sub{font-size:12px;margin-top:2px;color:var(--muted)}
.actrow{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;flex-wrap:wrap;row-gap:var(--s2)}
.actrow .main{flex:1;min-width:260px}
.actrow .eff{flex:none;text-align:right;font-size:13px;width:170px}
.actrow .cta{flex:none;display:flex;align-items:center;gap:var(--s2);justify-content:flex-end;min-width:200px}
.chartsvg{display:block;width:100%;height:170px;margin-top:var(--s3);overflow:visible;cursor:crosshair}
.chartaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.chartcap{font-size:11.5px;color:var(--muted);margin-top:var(--s2)}
.chartcap .dash{display:inline-block;width:16px;border-top:1px dashed currentColor;vertical-align:middle;margin-right:6px;opacity:.7}
.sess .head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;cursor:pointer}
.sess .chev{flex:none;width:12px;font-size:11px;color:var(--muted)}
.sess .body{padding:0 0 var(--s4) 26px;max-width:76ch}
.confirmbar{padding:0 0 var(--s3) 0;max-width:78ch;font-size:13.5px}
.confirmbar .q{border-left:1px solid var(--accent);padding-left:var(--s3);margin-bottom:var(--s2)}
.resultbar{display:inline-flex;align-items:center;gap:var(--s2);flex-wrap:wrap;row-gap:var(--s1);font-size:13px}
.errbar{border-left:1px solid var(--accent);padding-left:var(--s3);font-size:13.5px;background:rgba(var(--accent-rgb),.06);
  padding-top:var(--s2);padding-bottom:var(--s2);border-radius:0 var(--r-md) var(--r-md) 0}
.rowtools{display:flex;gap:var(--s1);align-items:center;flex:none}
.rowtools button{font-family:var(--font-ui);font-size:11.5px;color:var(--faint);background:none;border:0;cursor:pointer;padding:3px 6px;border-radius:var(--r-md)}
.rowtools button:hover{color:var(--accent);background:rgba(var(--accent-rgb),.08)}

/* ---------------- bars / calendar ---------------- */
.splitbar{display:flex;height:10px;gap:2px}
.splitbar span{background:var(--accent);min-width:0}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3)}
.legend span.k{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend span.k i{width:9px;height:9px;background:var(--accent);display:inline-block;flex:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:center;
  padding-bottom:var(--s1);color:var(--muted);font-family:var(--font-ui)}
.calcell{min-height:48px;border:1px solid var(--rule);padding:5px 6px;display:flex;flex-direction:column;cursor:pointer;text-align:left;background:none;color:inherit;font:inherit}
.calcell .d{font-size:10px;color:var(--muted)}
.calcell .t{margin-top:auto;font-size:11.5px;font-family:var(--font-heading)}
.calcell.today{outline:1.5px solid var(--accent);outline-offset:-1px}
.calcell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.calcell.pad{opacity:.3;cursor:default}

/* ---------------- toast + modal ---------------- */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:300;
  background:var(--ink);color:var(--bg);font-size:13px;padding:8px 16px;border-radius:999px;
  box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:var(--s4);z-index:200;
  background:rgba(20,19,18,.55)}
.overlay.hidden{display:none}
.dialog{width:min(460px,100%);display:flex;flex-direction:column;gap:var(--s3);padding:var(--s6);
  border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-lg);border:1px solid var(--rule)}
.dialog h4{margin:0}
.cmdbox{font-family:var(--font-mono);font-size:12px;background:var(--hover);border:1px solid var(--rule);
  border-radius:var(--r-md);padding:9px 11px;word-break:break-all;user-select:all}

/* ---------------- responsive ---------------- */
@media(max-width:820px){
  main{padding:var(--s6) var(--s4) 80px}
  .nav{padding:var(--s3) var(--s4);gap:var(--s3)}
  h1{font-size:34px}
  .hero-h1{font-size:34px}
  .figs{grid-template-columns:1fr;margin-left:0}
  .figs .fig{border-left:0;border-top:1px solid var(--rule)}
  .figs .fig:first-child{border-top:0}
  .actrow .eff{width:auto;text-align:left;flex:1 1 100%}
  .actrow .cta{min-width:0;flex:1 1 100%;justify-content:flex-start}
  .calcell{min-height:40px}
}
@media(max-width:560px){
  .nav-brand{font-size:16px}
  .calgrid{gap:2px}
  .calcell .t{font-size:10.5px}
}
</style>
<script>
(function(){
  var GROUND={light:"#fdfcf8",dark:"#161511",soft:"#e9ebf0"};
  function hex(c){return /^#[0-9a-fA-F]{6}$/.test(c||"");}
  function ap(a){if(!hex(a))return false;var s=document.documentElement.style;
    s.setProperty("--accent",a);
    s.setProperty("--accent-rgb",parseInt(a.slice(1,3),16)+","+parseInt(a.slice(3,5),16)+","+parseInt(a.slice(5,7),16));
    return true;}
  function themeOf(p){
    if(!hex(p))return "light";
    if(p.toLowerCase()===GROUND.soft)return "soft";
    var r=parseInt(p.slice(1,3),16),g=parseInt(p.slice(3,5),16),b=parseInt(p.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255<0.5?"dark":"light";
  }
  function pp(p){
    var root=document.documentElement;
    if(!hex(p)){root.dataset.theme="light";root.style.removeProperty("--bg");return false;}
    root.dataset.theme=themeOf(p);
    if(p.toLowerCase()===GROUND[root.dataset.theme]) root.style.removeProperty("--bg");
    else root.style.setProperty("--bg",p);
    return true;
  }
  window.__tbGround=GROUND; window.__tbAccent=ap; window.__tbPrimary=pp; window.__tbThemeOf=themeOf;
  var ca="__ACCENT__", cp="__PRIMARY__";
  ap(ca); pp(cp);
  window.__tbSyncedAccent=function(){return ca;};
  setInterval(function(){
    fetch("/api/theme").then(function(r){return r.json();}).then(function(t){
      if(!t)return;
      if(t.accent&&t.accent!==ca&&ap(t.accent)){ca=t.accent; if(window.__tbAccentChanged)window.__tbAccentChanged(t.accent);}
      if((t.primary||"")!==cp){cp=t.primary||""; pp(cp); if(window.__tbGroundChanged)window.__tbGroundChanged(cp);}
    }).catch(function(){});
  },12000);
})();
</script>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="nav">
  <span class="nav-brand">
    <span class="logo"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="1.7" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="2.2"/><path d="M9 3.6V20.4M15.4 3.6V13M9 13H20.4M15.4 8.2H20.4" stroke="#fff" stroke-opacity=".92" stroke-width="2.2" fill="none"/></svg></span>
    Token&nbsp;Burn
  </span>

async function copyText(t, okMsg){
  try{ await navigator.clipboard.writeText(t); toast(okMsg||"Copied"); return true; }catch(e){}
  try{                                   // fallback for older engines and denied clipboard permission
    const ta=document.createElement("textarea");
    ta.value=t; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok){ toast(okMsg||"Copied"); return true; }
  }catch(e){}
  toast("Could not copy. Select the text and copy it by hand.");
  return false;
}
function pts(vals, max, w, h){

  return vals.map((v,i)=>(i*(w/(vals.length-1))).toFixed(1)+","+(h-(max?v/max*h:0)).toFixed(1)).join(" ");

          pct:k=>total>0?(({input:i,cache_read:cr,cache_write:cw,output:o})[k]/total*100):0};
}
function hasHistory(){ return !!(S.data && ((S.data.days||[]).length || (+S.data.grand||0)>0)); }

/* --- what to say when nothing is running -------------------------------------------------
   Most people install a tracker BETWEEN sessions, not during one. The old idle headline read
   "N tokens of headroom, and nothing burning" over an empty chart and a row of zeroes, which
   looks like a dashboard that failed rather than one with nothing to report. These two helpers
   let the idle state lead with what the tool actually knows about that person's own history. */
function resentShare(){
  const tb=(S.data&&S.data.tokenBreakdown)||null;
  if(!tb) return null;
  const cr=+tb.cache_read||0, denom=cr+(+tb.input||0)+(+tb.cache_write||0)+(+tb.output||0);
  if(denom<=0) return null;
  return Math.round(1000*cr/denom)/10;
}
function lastActiveDay(){
  const days=((S.data&&S.data.days)||[]).filter(d=>(+d.total||0)>0);
  return days.length ? days[days.length-1].date : null;
}
function firstActiveDay(){
  const days=((S.data&&S.data.days)||[]).filter(d=>(+d.total||0)>0);
  return days.length ? days[0].date : null;
}
function daysSince(iso){
  if(!iso) return null;
  const then=new Date(iso+"T00:00:00"), now=new Date();
  return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/86400000);
}

/* Rolling-window figures, from the hourly buckets of /api/series?range=5d.
   win  = tokens in the last WINDOW_HOURS hours
   peak = the heaviest WINDOW_HOURS stretch we have measured in those five days */
function windowStats(){
  const s=S.series["5d"];
  if(!s || !(s.buckets||[]).length) return null;
  const b=s.buckets.map(x=>({ts:+x.ts, v:Object.keys(x.tools||{}).reduce((a,k)=>a+(+x.tools[k]||0),0)}));
  const now=Date.now(), cutoff=now-WINDOW_HOURS*3600*1000;
  let win=0; b.forEach(x=>{ if(x.ts>=cutoff) win+=x.v; });
  let peak=0;
  for(let i=0;i+WINDOW_HOURS<=b.length;i++){
    let s5=0; for(let j=i;j<i+WINDOW_HOURS;j++) s5+=b[j].v;
    if(s5>peak) peak=s5;
  }
  return {win, peak, buckets:b};
}
function ceilingInfo(){
  const w=windowStats();
  if(S.cap>0) return {cap:S.cap, win:w?w.win:0, source:"cap", ready:true};
  if(!w || w.peak<=0) return {cap:0, win:w?w.win:0, source:"none", ready:false};
  return {cap:w.peak, win:w.win, source:"peak", ready:true};
}
function burnPerMin(){ return Math.max(0, Math.round((S.live&&S.live.burn&&S.live.burn.perMin)||0)); }

/* Chart series in tokens a minute. "live" = samples taken since the page
   opened; "day" = the last 24 hourly buckets divided by 60. */
function chartSeries(){
  if(S.span==="live"){
    const v=S.liveSamples.slice(-LIVE_SAMPLES_MAX);
    const full=v.length>=LIVE_SAMPLES_MAX;
    return {vals:v, left: full ? "6 min ago" : "page opened", stepMs:8000,
            empty: v.length<2 ? "Collecting. One reading every eight seconds. The 24-hour view is already full." : null};
  }
  const s=S.series["1d"], b=(s&&s.buckets)||[];
  const vals=b.map(x=>Object.keys(x.tools||{}).reduce((a,k)=>a+(+x.tools[k]||0),0)/60);
  /* A flat line pinned to zero is worse than no chart: it reads as a broken widget rather than
     as an idle day. When every bucket is zero, say so and point at the last day that was not. */
  const allZero = vals.length>=2 && vals.every(v=>!v);
  const la = (typeof lastActiveDay==="function") ? lastActiveDay() : null;
  const gap = (typeof daysSince==="function") ? daysSince(la) : null;
  return {vals, left:"24 h ago", stepMs:3600000, tsFirst:b.length?+b[0].ts:0,
          empty: b.length<2 ? "No hourly readings yet."
               : (allZero ? ("Nothing ran in the last 24 hours."
                   + (la ? " Your last logged activity was " + shortDate(la)
                          + (gap>1 ? ", " + gap + " days ago." : ".") : "")
                   + " Where it went still has your whole history.") : null)};
}

/* ===========================================================================
   Actions. One list, built from real data, used by both Today (live rows plus
   the single best standing fix) and Fixes (all of them, grouped).
   ======================================================================== */
function actionVisible(a){
  if(S.dismissed[a.id]) return false;
  const until=S.snoozed[a.id];
  if(until && Date.now()<until) return false;
  return true;
}
function buildActions(){
  const d=S.data||{}, live=S.live||{}, grand=+d.grand||0;
  const ins=(live.insights&&(live.insights.suggestions||live.insights.waste)) ? live.insights : (d.insights||{});
  const bd=breakdown(), lk=(S.leaks&&S.leaks.leaks)||null;
  const out=[];
  const winLabel = S.leakWin==="all" ? "all time" : ("the last "+S.leakWin+" days");

  /* --- live: idle leftover processes ------------------------------------ */
  const lo=(live.leftovers)||{};
  if((+lo.count||0)>0){
    const list=(S.leftovers&&S.leftovers.leftovers)||[];
    const kinds=[...new Set(list.map(x=>String(x.kind||"")))].filter(Boolean);
    out.push({
      id:"leftovers", group:"now", live:true, tag:"Running now", src:"Live",
      title:`${lo.count} idle leftover process${lo.count>1?"es":""} ${lo.count>1?"are":"is"} holding ${Math.round(lo.freedMB)} MB`,
      what:"Stray background processes left behind by runs that already finished. They sit in memory and use no tokens.",
      usage: (kinds.length? kinds.join(", ")+". " : "") + "Your active sessions, the Claude app and this tracker are never included.",
      result:"Quitting frees the memory. It will not change your token burn, and we would rather say so than pad the list.",
      save:null, perMinLabel:`${Math.round(lo.freedMB)} MB, no tokens`, perMinRank:0,
      cta:"Quit them", doneLab:"Quit",
      confirm:{stops:`${lo.count} idle background process${lo.count>1?"es":""}.`,
               survives:"Every chat you have open, every log file, and the apps themselves."},
      run:async()=>{
        const r=await apiPOST("/api/kill_leftovers");
        if(!r||!r.ok) return {ok:false, message:srv((r&&r.error)||"Could not quit them."),
          next:"Nothing was changed. Try again, or quit them from Activity Monitor."};
        return {ok:true, message:`Quit ${r.count} process${r.count===1?"":"es"} and freed about ${r.freedMB} MB.`,
          next:"There is nothing to undo: these were leftovers, and your tool starts a fresh process the next time you use it."};
      }
    });
  }

  /* --- live: every running chat that is mostly re-reading itself --------- */
  const running=(live.running||[]).slice().sort((a,b)=>(+b.burnMin||0)-(+a.burnMin||0));
  const rereadPct=bd.pct("cache_read");
  if(rereadPct>=40){
    running.filter(x=>(+x.burnMin||0)>0).slice(0,3).forEach((sess,si)=>{
      const perMin=Math.round(sess.burnMin*rereadPct/100);
      const tfile=chatFileFor(sess.title);
      const dispatch=!!(tfile && tfile.indexOf("/local_ditto_")>=0);
      const targetHTML=`<div style="font-size:14px;margin-top:var(--s1)">Paste it into: <b style="color:var(--accent)">“${esc(clip(sess.title,80))}”</b>`+
        (dispatch?` <span class="muted">(this looks like the app&#39;s built-in Dispatch chat, so it may not sit in your normal sidebar list)</span>`:``)+`</div>`;
      out.push({
        id:"compact-live-"+String(sess.title||si).replace(/[^a-zA-Z0-9]+/g,"").slice(0,28),
        group:"now", live:true, tag:"Running now", src:"Live",
        title: si===0 ? "The busiest chat running now is mostly re-reading itself"
                      : `“${clip(sess.title,52)}” is also mostly re-reading itself`,
        what:`“${clip(sess.title,72)}” re-sends its whole history with every turn, so most of what it burns is text it has already sent.`,
        usage:`It is burning ${fmt(sess.burnMin)} tokens a minute, and ${Math.round(rereadPct)}% of everything this Mac has measured is cache reads.`,
        result:"Carrying the thread into a fresh chat resets the re-reading to nothing. The old transcript stays on disk.",
        save:null,
        perMinLabel:`about ${fmt(perMin)}/min, estimated`, perMinRank:perMin,
        estBasis:`Estimated from this session at ${fmt(sess.burnMin)}/min and your measured ${Math.round(rereadPct)}% cache-read share.`,
        cta:"Copy the compact prompt", doneLab:"Copied", targetHTML,
        confirm:{stops:"The re-reading, once you paste the note into a new chat.",
                 survives:"The full transcript on disk, and everything the chat has already produced.",
                 extra:"We cannot compact another app's chat from here, so this copies a prompt for you to paste."},
        run:async()=>{
          const ok=await copyText(HANDOFF,"Copied the compact prompt");
          return ok ? {ok:true, message:"Copied.", next:`Paste it into “${clip(sess.title,60)}”, then open a new chat with the note it hands back.`}
                    : {ok:false, message:"Could not reach the clipboard.", next:"Open Fixes and copy the prompt from there."};
        }
      });
    });
  }

  /* --- login agents and scheduled jobs ---------------------------------- */
  (ins.waste||[]).forEach((w,i)=>{
    const idb="waste-"+i+"-"+String(w.agent||w.label||"").replace(/[^a-zA-Z0-9]+/g,"");
    if(w.executable && w.agent){
      out.push({
        id:idb, group:"now", live:true, tag:"Runs unattended", src:"Fixes",
        title:srvLabel(w.label||w.agent), what:srv(w.what), usage:srv(w.metric||w.usage), result:srv(w.impact),
        save:null, perMinLabel:"not measured", perMinRank:-1,
        cta:"Switch it off", doneLab:"Switched off",
        confirm:{stops:"This helper, now and at every future login.",
                 survives:"Everything it has already produced. Its setup file moves to the Trash, so you can put it back."},
        run:async()=>{
          const r=await apiPOST("/api/fix",{agent:w.agent});
          if(!r||!r.ok) return {ok:false, message:srv((r&&r.error)||"Could not switch it off."),
            next:"Nothing was changed. You can disable it yourself in System Settings, Login Items."};
          return {ok:true, message:srv(r.message||"Switched off."),
            next:"To put it back, restore the .plist from your Trash and log out and in again."};
        }
      });
    } else {
      out.push({
        id:idb, group:"worth", live:false, tag:"Runs unattended", src:"Fixes",
        title:srvLabel(w.label||"Scheduled job"), what:srv(w.what), usage:srv(w.metric||w.usage), result:srv(w.impact),
        save:null, savePer:"", how:srv(w.how), cta:"Show me how", doneLab:"Shown"
      });
    }
  });

  /* --- the leak board: splitting the heaviest chats ---------------------- */
  if(lk && (lk.chats||[]).length){
    const saves=lk.chats.reduce((a,c)=>a+(+c.saves||0),0);
    if(saves>0){
      out.push({
        id:"compact-chats", group:"worth", live:false, tag:"Leak", src:"Where it went",
        title:"Your longest chats are paying for their own history",
        what:"Re-sent text grows with the square of a chat's length: turn 200 re-sends 200 turns of history. Splitting a long chat into shorter ones cuts the total.",
        usage: lk.topShare==null
          ? `Across ${winLabel}, ${fmt(lk.totalResent)} of re-sent text across ${nfmt(lk.measured)} chat${lk.measured===1?"":"s"}.`
          : `Across ${winLabel}, the ${topN(lk)} heaviest chats re-sent ${fmt(topResent(lk))} tokens between them, ${pctStr(lk.topShare)} of the ${fmt(lk.totalResent)} re-sent in total.`,
        result:"Carry each thread into a fresh chat with a short handoff note. The originals stay on disk and stay readable.",
        save:saves, savePer:"across "+winLabel,
        cta:"Copy the handoff prompt", doneLab:"Copied",
        run:async()=>{
          const ok=await copyText(HANDOFF,"Copied the handoff prompt");
          return ok ? {ok:true, message:"Copied.", next:"Paste it into a long chat, then start a new one with the note it gives back."}
                    : {ok:false, message:"Could not reach the clipboard.", next:"Select the prompt on the Where it went page and copy it by hand."};
        },
        link:{view:"where", label:"See the chats"}
      });
    }
  }

  /* --- habits, from the measured token split ---------------------------- */
  if(bd.total>0){
    const outPct=bd.pct("output"), inPct=bd.pct("input");
    if(outPct>=12){
      const oCost=(S.costs&&S.costs.tokenBreakdown&&S.costs.tokenBreakdown.output&&S.costs.tokenBreakdown.output.usd)||0;
      const tCost=(S.costs&&S.costs.total)||0;
      out.push({
        id:"habit-output", group:(outPct>=25?"worth":"minor"), live:false, tag:"Habit", src:"Efficiency",
        title:"You ask for whole files where a diff would do",
        link:{view:"coach", label:"Check your next prompt first"},
        what:"Output is the most expensive kind of token, and a regenerated file is mostly text you already had.",
        usage:`Output is ${pctStr(outPct)} of your tokens`+(tCost>0?` and ${pctStr(oCost/tCost*100)} of the list-price equivalent.`:"."),
        result:"Say “just the change” and you get a patch instead of a rewrite: the same edit for a fraction of the output.",
        save:null, savePer:"", cta:"Copy the wording", doneLab:"Copied",
        run:async()=>{
          const ok=await copyText("Reply with just the change as a diff or a patch. Do not re-print the whole file, and skip the explanation unless I ask.","Copied");
          return ok?{ok:true,message:"Copied.",next:"Add it to the end of your next request, or put it in that project's CLAUDE.md."}
                   :{ok:false,message:"Could not reach the clipboard.",next:"Select the sentence above and copy it by hand."};
        }
      });
    }
    if(inPct>=12){
      out.push({
        id:"habit-input", group:(inPct>=25?"worth":"minor"), live:false, tag:"Habit", src:"Efficiency",
        title:"Big pasted prompts are driving your usage",
        link:{view:"coach", label:"Check your next prompt first"},
        what:"Pasted files are counted in full every time. Naming the path instead lets the tool read only what it needs.",
        usage:`Fresh input is ${pctStr(inPct)} of your tokens, ${fmt(bd.input)} in all.`,
        result:"Reference files by path and name the two or three that matter, instead of pasting them whole.",
        save:null, savePer:"", cta:"Copy the wording", doneLab:"Copied",
        run:async()=>{
          const ok=await copyText("Read these files yourself rather than waiting for me to paste them: [path], [path]. Ask before reading anything else.","Copied");
          return ok?{ok:true,message:"Copied.",next:"Fill in the paths and send that instead of the paste."}
                   :{ok:false,message:"Could not reach the clipboard.",next:"Select the sentence above and copy it by hand."};
        }
      });
    }
  }

  /* --- whatever the backend found in your own history -------------------- */
  (ins.suggestions||[]).forEach((s,i)=>{
    const reveal=s.reveal?{label:srv(s.revealLabel||"Details"), text:srv(s.reveal)}:null;
    if(s.folder){
      /* flagged heavy folder: a real one-click fix, not Finder homework */
      out.push({
        id:"folder-"+i, group:"worth", live:false, tag:String(s.tag||"Heavy folder"), src:"Efficiency",
        title:srv(s.text).split(". ")[0]+".",
        what:srv(s.text),
        usage:"", result:"The whole folder moves to the Trash. Its token history on this page stays.",
        save:null, savePer:"", reveal,
        cta:"Move it to the Trash", doneLab:"In the Trash",
        confirm:{stops:`Nothing that is running. The folder ${s.folder} and every file in it moves to the Trash.`,
                 survives:"Its token history here, and the folder itself inside the Trash until you empty it. Drag it back out to undo.",
                 extra:"Only do this if you no longer need that project's files. This moves your real files, not just their numbers."},
        run:async()=>{
          const r=await apiPOST("/api/trash_folder",{path:s.folder});
          if(!r||!r.ok) return {ok:false, message:srv((r&&r.error)||"Could not move it."),
            next:"Nothing was changed. You can still move it yourself in Finder; the reveal below says where it is."};
          return {ok:true, message:srv(r.message||"Moved to the Trash."),
            next:"Drag it back out of the Trash to undo. The tokens it already burned stay on this page."};
        }
      });
      return;
    }
    out.push({
      id:"sug-"+i, group:"worth", live:false, tag:String(s.tag||"Habit"), src:"Efficiency",
      title:srv(s.text).split(". ")[0]+".",
      what:srv(s.text), usage:"", result:"",
      save:null, savePer:"", cta:reveal?reveal.label:"", doneLab:"",
      reveal
    });
  });

  /* rank: measured token savings first, then live rows by their per-minute
     effect, then everything we cannot measure. Nothing here is invented. */
  const small = a => a.save!=null && grand>0 && a.save/grand < 0.01;
  out.forEach(a=>{ if(small(a) && a.group==="worth") a.group="minor"; });
  const byRank=(a,b)=>{
    const av=a.save!=null?a.save:-1, bv=b.save!=null?b.save:-1;
    if(av!==bv) return bv-av;
    return (b.perMinRank||0)-(a.perMinRank||0);
  };
  return out.filter(actionVisible).sort(byRank);
}
function actionById(id){ return buildActions().filter(a=>a.id===id)[0]; }
function hiddenCount(){
  const ids=Object.keys(S.dismissed).filter(k=>S.dismissed[k]).length;
  const sn=Object.keys(S.snoozed).filter(k=>S.snoozed[k]>Date.now()).length;
  return ids+sn;
}

/* ---------- shared fragments ---------- */
function confirmHTML(a){
  const c=a.confirm||{};
  return `<div class="confirmbar rise">
    ${a.targetHTML||""}
    <div class="q"><b>What stops:</b> ${esc(c.stops||"nothing that is running")}<br>
      <b>What survives:</b> ${esc(c.survives||"everything else")}${c.extra?`<br><span class="muted">${esc(c.extra)}</span>`:""}</div>

}

  if(!r.ok) return `<div class="errbar rise"><b>That did not work.</b> ${esc(r.message)}<br><span class="muted">${esc(r.next||"")}</span></div>`;
  return `<span class="resultbar rise"><span class="tag tag-accent">${esc(a.doneLab||"Done")}</span>
    <span>${esc(r.message)}</span><span class="muted">${esc(r.next||"")}</span></span>`;
}
function rowToolsHTML(a){
  return `<span class="rowtools">
    <button data-act="fixsnooze" data-id="${attr(a.id)}" title="Hide this row for an hour">Snooze</button>
    <button data-act="fixdismiss" data-id="${attr(a.id)}" title="Hide this row for the rest of this session">Dismiss</button>
  </span>`;
}
function ctaHTML(a){
  if(S.ran[a.id]) return resultHTML(a);
  if(S.busy[a.id]) return `<span class="muted" style="font-size:13px">Working…</span>`;
  if(!a.cta) return "";
  const needsConfirm=!!a.confirm;
  return `<button class="btn btn-secondary" data-act="${needsConfirm?"fixask":"fixgo"}" data-id="${attr(a.id)}">${esc(a.cta)}</button>`;
}

<script>
/* ===========================================================================

function heroHTML(){
  const ci=ceilingInfo(), burn=burnPerMin(), d=S.data||{};
  const now=new Date();
  let stamp="";
  try{ stamp=`${WD[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}`; }catch(e){}
  const at=(S.live&&S.live.at) ? `live · read at ${S.live.at}` : "live · updates every eight seconds";

  if(!S.data){
    return `<h6 class="muted num">${esc(stamp)}</h6>
      <h1 class="hero-h1">Waiting for the tracker.</h1>
      <p style="max-width:64ch;margin:var(--s3) 0 0;font-size:16px">This page could not reach the tracker on this Mac. It retries on its own. If it does not come back, the background server may have stopped: quit and reopen Token Burn Tracker.</p>`;
  }
  if(!hasHistory() && S.data.loading){
    return `<h6 class="muted num">${esc(stamp)}</h6>
      <h1 class="hero-h1">Reading your logs for the first time.</h1>
      <p class="num" style="max-width:64ch;margin:var(--s3) 0 0;font-size:16px">${esc(nfmt(S.data.parsed||0))} of ${esc(nfmt(S.data.files||0))} files so far. The first scan is the slow one, because every later scan only reads what changed.</p>`;
  }
  if(!hasHistory()){
    return `<h6 class="muted num">${esc(stamp)} · ${esc(at)}</h6>
      <h1 class="hero-h1">Nothing has been read from your logs yet.</h1>
      <p style="max-width:64ch;margin:var(--s3) 0 0;font-size:16px">Claude Code, Cowork and Codex are found automatically the first time they write a session log. Use one of them for a few minutes and this page fills in. If you use something else, point the tracker at its logs under Settings.</p>
      ${(S.data.error)?`<div class="errbar" style="margin-top:var(--s4)"><b>The last scan reported a problem.</b> ${esc(String(S.data.error).split("\n")[0])}<br><span class="muted">Try Rescan under Settings. Your logs are only ever read, never written.</span></div>`:""}`;
  }

  let verdict, why, idleWhy=null;
  const capLine = ci.source==="cap"
    ? `your cap ${fmt(ci.cap)}`
    : (ci.ready ? `ceiling about ${fmt(ci.cap)}` : "no ceiling yet");
  const basis = ci.source==="cap"
    ? "Measured against the cap you entered in Settings."
    : "Measured against your own heaviest five hours in the last five days, because we cannot read your plan's cap.";

  if(!ci.ready){
    verdict="No ceiling to measure against yet.";
    why="This Mac has not logged a busy stretch we could use as your own high-water mark, and we cannot read your plan's cap. Keep working and it fills in, or enter your cap under Settings.";
  } else {
    const left=Math.max(0, ci.cap-ci.win);
    if(left<=0){ verdict = ci.source==="cap" ? "You are past the cap you entered." : "You are at your heaviest five hours so far."; }
    else if(burn<=0){
      /* Idle. Lead with the finding from this person's own logs, not with a row of zeroes. */
      const pct=resentShare(), la=lastActiveDay(), gap=daysSince(la);
      verdict = (pct!=null)
        ? `${pct}% of every token you have sent was history, re-sent.`
        : "Nothing running right now.";
      const bits=[];

      if(pct!=null) bits.push("You typed it once and paid for it again on every message after.");
      if(la) bits.push(gap===0 ? "Last active today." : (gap===1 ? "Last active yesterday." : `Nothing logged for ${gap} days, so today reads zero.`));

      lead=`One session, “${clip(t.title,58)}”, is burning ${Math.round((+t.burnMin||0)/tot*100)}% of it. `;
    }

    // ceiling basis line is the fallback for every other state.

  }

  const pct=ci.ready&&ci.cap>0 ? Math.min(100, ci.win/ci.cap*100) : 0;
  const bar=`<div style="margin:var(--s6) 0 0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;row-gap:var(--s1);font-size:13px">
      <span class="num" style="white-space:nowrap"><b>${esc(fmt(ci.win))}</b> in the last five hours</span>
      <span class="muted num" style="white-space:nowrap">${esc(capLine)}</span>
    </div>
    <div style="position:relative;height:3px;background:var(--rule);margin-top:var(--s3)">
      <span style="position:absolute;left:0;top:0;bottom:0;width:${pct.toFixed(1)}%;background:var(--accent)"></span>
    </div>
  </div>`;

  return `<h6 class="muted num">${esc(stamp)} · ${esc(at)}</h6>
    <h1 class="hero-h1">${esc(verdict)}</h1>
    <p style="max-width:66ch;margin:var(--s3) 0 0;font-size:16px">${esc(why)}</p>
    ${bar}`;
}

function chartHTML(){
  const cs=chartSeries(), ci=ceilingInfo(), burn=burnPerMin();
  const sustain = ci.ready&&ci.cap>0 ? ci.cap/(WINDOW_HOURS*60) : 0;
  const W=940, H=150;
  const spans=[["live","Last 6 min"],["day","Last 24 h"]].map(r=>
    `<label class="seg-opt" data-act="pinspan"><input type="radio" name="tbspan" ${S.span===r[0]?"checked":""} data-act="setspan" data-v="${r[0]}">${r[1]}</label>`).join("");

  let body;
  if(cs.empty){
    body=`<p class="muted" style="margin:var(--s4) 0 0;font-size:13.5px">${esc(cs.empty)}</p>`;
  } else {
    const max=Math.max.apply(null, cs.vals.concat([sustain||0]))*1.18 || 1;
    const line=pts(cs.vals,max,W,H);
    const hi=S.hover;
    const sy=(H-(sustain/max*H));
    const hx = hi==null?0:(hi*(W/Math.max(1,cs.vals.length-1)));
    const hy = hi==null?0:(H-cs.vals[hi]/max*H);
    /* Labels live outside the SVG so they stay the same size at any window width. */
    body=`<svg class="chartsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-act="chart" role="img"
        aria-label="Tokens a minute over the selected span">
      <line x1="0" y1="${H-0.5}" x2="${W}" y2="${H-0.5}" stroke="var(--rule)" vector-effect="non-scaling-stroke"></line>
      ${sustain>0?`<line x1="0" y1="${sy.toFixed(1)}" x2="${W}" y2="${sy.toFixed(1)}" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5" opacity=".5" vector-effect="non-scaling-stroke"></line>`:""}
      <polygon points="0,${H} ${line} ${W},${H}" fill="var(--accent)" opacity=".10"></polygon>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
      ${hi!=null?`<g><line x1="${hx.toFixed(1)}" y1="0" x2="${hx.toFixed(1)}" y2="${H}" stroke="currentColor" opacity=".3" vector-effect="non-scaling-stroke"></line>
        <line x1="${hx.toFixed(1)}" y1="${(hy-5).toFixed(1)}" x2="${hx.toFixed(1)}" y2="${(hy+5).toFixed(1)}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"></line></g>`:""}
    </svg>
    <div class="chartaxis"><span>${esc(cs.left)}</span><span>now</span></div>
    ${sustain>0?`<div class="chartcap"><span class="dash"></span>pace that lasts a full five hours: <span class="num">${esc(fmt(sustain))}</span> a minute</div>`:""}`;
  }

  let readVal, readSub;
  if(S.hover!=null && cs.vals[S.hover]!=null){
    const v=cs.vals[S.hover];
    const back=(cs.vals.length-1-S.hover)*cs.stepMs;
    let when="";
    try{ when=new Date(Date.now()-back).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }catch(e){}
    readVal=`${fmt(v)} a minute`;
    readSub=`${when}${sustain>0?(v>sustain?" · above pace":" · inside pace"):""}`;
  } else {
    readVal=`${fmt(burn)} a minute`;
    readSub= sustain>0 ? (burn>sustain?"above the pace that lasts":"inside the pace that lasts")
                       : "no ceiling set, so there is no pace to compare against";
  }

  return `<section style="margin:var(--s8) 0 0">
    <div style="display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;row-gap:var(--s2)">
      <h4 style="margin:0">Tokens a minute</h4>
      <span class="seg">${spans}</span>
      <span style="margin-left:auto;text-align:right;font-size:13px;min-height:34px" class="num">
        <span style="display:block">${esc(readVal)}</span>
        <span class="muted" style="display:block;font-size:12px">${esc(readSub)}</span>
      </span>
    </div>
    ${body}
    <p class="muted" style="margin:var(--s2) 0 0;font-size:12px">Hover the line to read any moment.${sustain>0?" The dashed rule is the pace that would keep you inside the ceiling for a whole five hours. Above it, you run out early.":""}</p>
  </section>`;
}

function figsHTML(){
  const d=S.data||{}, c=S.costs||{}, bd=breakdown();
  const today=+d.today||0, week=+d.week||0;
  const days=(d.days||[]).filter(x=>x.date!=="unknown");
  /* d.week is the rolling seven days ending today, so compare it with the seven
     calendar days before that, not with the last fourteen rows of days[] (which
     only holds days that had activity). */
  let weekSub="rolling seven days";
  const t0=new Date(); t0.setHours(0,0,0,0);
  const from=new Date(t0), to=new Date(t0);
  from.setDate(from.getDate()-13); to.setDate(to.getDate()-7);
  const fromS=isoLocal(from), toS=isoLocal(to);
  const prev=days.filter(x=>x.date>=fromS && x.date<=toS).reduce((a,x)=>a+(+x.total||0),0);
  const covered=days.some(x=>x.date<fromS);
  if(prev>0 && covered) weekSub=`${Math.round(week/prev*100)}% of the seven days before`;
  else if(prev>0) weekSub=`the seven days before came to ${fmt(prev)}`;
  const todaySub = S.showUsd && BLENDED_RATE>0
    ? `${usd(costOf(today))} at list prices`
    : `across ${Object.keys(d.byTool||{}).length||0} tools`;
  const crPct=bd.total>0 ? bd.pct("cache_read") : null;
  const figs=[
    {lab:"Today", val:fmt(today), sub:todaySub},
    {lab:"This week", val:fmt(week), sub:weekSub},
    {lab:"Cache reads", val: crPct==null?"not split":pctStr(crPct),
     sub: crPct==null?"no tool here reports a split":"of everything measured: the re-reading"}
  ];
  /* Codex reports one total per session with no split, so it is outside every
     figure that depends on the split. Saying nothing would read as zero. */
  const lk=leaksNow(), unmeasured=(lk&&+lk.unmeasuredTokens)||0;
  const codexNote = unmeasured>0
    ? `<p class="subtle" style="margin:var(--s2) 0 0">${esc(fmt(unmeasured))} tokens come from logs that only report totals (older Codex sessions and custom sources), so they sit outside the cache-read figure. They are counted in the totals, just not in the split.</p>`
    : "";
  /* Coverage, stated plainly. This reads the log files three tools write on THIS Mac. Work done
     in a cloud Cowork session or on claude.ai never touches those files, so it cannot appear
     here. Someone who spent all day in a cloud session and opens this to a zero should be told
     why, not left to conclude the tracker is broken. */
  /* Naming the newest file each tool wrote turns "is this thing even working?" into something
     the person can check for themselves: a recent stamp with a small number means their usage
     really was small, a stale stamp means the files are not being found, and those are very
     different problems. */
  const nl=(d.newestLog)||{};
  const stamps=Object.keys(nl).sort().map(k=>{
    const t=String(nl[k]).replace("T"," ");
    const day=String(nl[k]).slice(0,10);
    const g=(typeof daysSince==="function")?daysSince(day):null;
    const when = g===0?"today":(g===1?"yesterday":(g!=null?g+" days ago":t));
    return `${esc(k)} ${esc(when)}`;
  }).join(" &middot; ");
  const coverage = `<p class="subtle" style="margin:var(--s2) 0 0">Reads the logs Claude Code, Cowork and Codex write on this Mac. Work done in a cloud Cowork session or on claude.ai leaves no file here, so it is not counted.${stamps?` Newest log seen: ${stamps}.`:""}</p>`;
  return `<div class="figs">${figs.map(f=>`<div class="fig">
    <div class="lab">${esc(f.lab)}</div><div class="val num">${esc(f.val)}</div><div class="sub num">${esc(f.sub)}</div>
  </div>`).join("")}</div>${codexNote}${coverage}`;
}

function reclaimHTML(acts){
  const rows=acts.filter(a=>a.group==="now");
  const head=`<div style="display:flex;align-items:baseline;gap:var(--s3);margin:var(--s8) 0 var(--s2);flex-wrap:wrap;row-gap:var(--s1)">
      <h4 style="margin:0">Reclaim it now</h4>
      <span class="muted" style="font-size:12.5px">One click each. Every row says what stops and what survives before it runs.</span>
      ${hiddenCount()?`<button class="btn btn-ghost btn-sm" data-act="unhide" style="margin-left:auto">Show ${hiddenCount()} hidden</button>`:""}
    </div>`;
  if(!rows.length){
    return head+`<div class="card" style="padding:var(--s4)">
      <div class="card-kicker">Good news</div>
      <div style="font-size:15px">Nothing is leaking right now. No idle leftovers, no unattended agents, and no running chat that is mostly re-reading itself.</div>
      <div class="muted" style="font-size:13px">This panel fills itself in the moment something starts wasting tokens, so it is worth leaving open while you work.</div>
    </div>`;
  }
  return head+`<div class="card elev-sm" style="background:var(--surface);border-left:3px solid var(--accent);padding:0 var(--s4);gap:0">${rows.map(a=>{
    const ask=S.asking[a.id];
    return `<div style="border-bottom:1px solid var(--rule);${S.ran[a.id]&&S.ran[a.id].ok?"opacity:.72;":""}">
      <div class="actrow">
        <span class="main">
          <span style="display:block;font-size:15px">${esc(a.title)}</span>
          <span class="muted" style="display:block;font-size:12.5px">${esc(a.usage||a.what)}</span>
          ${a.targetHTML||""}
          ${a.estBasis?`<span class="faint" style="display:block;font-size:12px">${esc(a.estBasis)}</span>`:""}
        </span>
        <span class="eff num">${esc(a.perMinLabel||"")}</span>
        <span class="cta">${ctaHTML(a)}${rowToolsHTML(a)}</span>
      </div>
      ${ask?confirmHTML(a):""}
    </div>`;
  }).join("")}</div>`;
}

function ledgerHTML(){
  if(!S.ledger.length) return "";
  const now=burnPerMin();
  const rows=S.ledger.slice(-8).reverse().map(e=>{
    let when=""; try{ when=new Date(e.t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }catch(x){}
    const delta=(e.burnThen>0)?`<span class="muted num" style="flex:none;font-size:12px">burn then ${esc(fmt(e.burnThen))}/min · now ${esc(fmt(now))}/min</span>`:"";
    return `<div class="r" style="display:flex;align-items:baseline;gap:var(--s3);padding:var(--s2) 0;flex-wrap:wrap;row-gap:var(--s1)">
      <span class="muted num" style="flex:none;font-size:12px;width:64px">${esc(when)}</span>
      <span style="flex:1;min-width:220px;font-size:14px">${esc(clip(e.label,90))}<span class="muted" style="font-size:12.5px"> · ${esc(e.msg)}</span></span>
      ${delta}
    </div>`;
  }).join("");
  return `<div style="display:flex;align-items:baseline;gap:var(--s3);margin:var(--s8) 0 var(--s2);flex-wrap:wrap;row-gap:var(--s1)">
      <h4 style="margin:0">Done while this page was open</h4>
      <span class="muted" style="font-size:12.5px">What each fix reported, and the burn reading before it against now. Burn moves for other reasons too; this is the reading, not a promise of cause.</span>
    </div><div class="rowlist">${rows}</div>`;
}

function standingHTML(acts){
  const hero=acts.filter(a=>a.group==="worth")[0];
  const more=acts.filter(a=>a.group!=="now").length;
  const head=`<div style="display:flex;align-items:baseline;gap:var(--s3);margin:var(--s8) 0 var(--s3);flex-wrap:wrap;row-gap:var(--s1)">
      <h4 style="margin:0">The one standing fix</h4>
      <a class="btn btn-ghost btn-sm" data-act="setview" data-v="fixes" href="#fixes" style="margin-left:auto">${more>1?`${more-1} more, ranked `:"All fixes "}&rarr;</a>
    </div>`;
  if(!hero){
    return head+`<div class="card" style="padding:var(--s4)">
      <div style="font-size:15px">Nothing standing to fix. No unattended jobs, and no habit in your measured usage is far enough out of line to be worth changing.</div>
    </div>`;
  }
  return head+`<div class="card elev-sm" style="padding:var(--s4);gap:var(--s3);background:var(--surface)">
    <div style="display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;row-gap:var(--s3)">
      <div style="flex:1;min-width:280px">
        <div class="card-kicker">${esc(hero.tag)}</div>
        <div class="card-title" style="font-size:22px;margin-top:var(--s1)">${esc(hero.title)}</div>
        <p style="margin:var(--s2) 0 0;font-size:14px;max-width:62ch">${esc(hero.what)} ${esc(hero.result||"")}</p>
        ${hero.usage?`<p class="muted" style="margin:var(--s2) 0 0;font-size:13px;max-width:62ch">${esc(hero.usage)}</p>`:""}
      </div>
      <div style="flex:none;width:200px;max-width:100%;text-align:right;border-left:1px solid var(--rule);padding-left:var(--s4)">
        <div class="muted" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-ui)">Gives back</div>
        <div class="num" style="font-family:var(--font-heading);font-size:${hero.save!=null?"25px":"15px"};line-height:1.25;margin-top:${hero.save!=null?"2px":"5px"}">${hero.save!=null?esc(fmt(hero.save)):"not measured"}</div>
        <div class="muted num" style="font-size:12px">${esc(hero.savePer||"")}${(hero.save!=null&&S.showUsd&&BLENDED_RATE>0)?" · "+esc(usd(costOf(hero.save)))+" at list prices":""}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap">
      ${hero.cta?ctaHTML(hero):""}
      ${hero.link?`<a class="btn btn-ghost btn-sm" data-act="setview" data-v="${attr(hero.link.view)}" href="#${attr(hero.link.view)}">${esc(hero.link.label)} &rarr;</a>`:""}
      ${rowToolsHTML(hero)}
    </div>
    ${S.asking[hero.id]?confirmHTML(hero):""}
  </div>`;
}

function sessionsHTML(){
  const live=S.live||{}, running=(live.running||[]).slice().sort((a,b)=>(+b.burnMin||0)-(+a.burnMin||0));
  const sy=live.system||{}, runs=(S.agents&&S.agents.runs)||[];
  const meta=[];
  if(sy.aiCpu!=null) meta.push(`AI CPU ${sy.aiCpu}%`);
  if(sy.aiRamMB!=null) meta.push(`AI RAM ${sy.aiRamMB>=1024?(sy.aiRamMB/1024).toFixed(1)+" GB":Math.round(sy.aiRamMB)+" MB"}`);
  if(sy.memUsedGB!=null&&sy.memTotalGB!=null) meta.push(`system ${sy.memUsedGB} of ${sy.memTotalGB} GB`);
  const head=`<div style="display:flex;align-items:baseline;gap:var(--s3);margin:var(--s8) 0 var(--s2);flex-wrap:wrap;row-gap:var(--s1)">
      <h4 style="margin:0">Active this minute</h4><span class="muted num" style="font-size:12.5px">${esc(meta.join(" · "))}</span>
    </div>`;
  if(!running.length){
    const idle=(live.idle||[]);
    return head+`<div class="card" style="padding:var(--s4)">
      <div style="font-size:15px">Nothing has run in the last ten minutes.</div>
      <div class="muted" style="font-size:13px">${idle.length?esc(idle.map(g=>`${g.count} idle ${g.tool} process${g.count>1?"es":""}, up to ${g.uptime}, ${g.ram||""}`).join(" · ")):"Start a chat in Claude Code, Cowork or Codex and it appears here within a few seconds."}</div>
    </div>`;
  }
  const tot=running.reduce((a,x)=>a+(+x.burnMin||0),0);
  const rows=running.map((x,i)=>{
    const key="sess-"+i;
    const open=!!S.open[key];
    const run=runs.filter(r=>r.title && x.title && (r.title.slice(0,40)===String(x.title).slice(0,40)))[0];
    const chips=[];
    if(run){
      if(run.toolCalls) chips.push(`${run.toolCalls} tool call${run.toolCalls>1?"s":""}`);
      if(run.patches) chips.push(`${run.patches} code edit${run.patches>1?"s":""}`);
      if(run.mcp) chips.push(`${run.mcp} MCP call${run.mcp>1?"s":""}`);
      if((run.subagents||[]).length) chips.push(`${run.subagents.length} sub-agent${run.subagents.length>1?"s":""}`);
    }
    const link=(run&&run.file)
      ? `<a class="linky" href="/transcript?file=${encodeURIComponent(run.file)}" target="_blank" rel="noopener">Open the full transcript &#8599;</a>`
      : `<span class="muted">No transcript file is exposed for this one.</span>`;
    const detail = run
      ? `${esc(run.tool)} run, last activity ${run.ago<60?run.ago+" s":Math.round(run.ago/60)+" min"} ago, status ${esc(run.status)}.`
      : `Seen as a ${esc(x.kind||"session")} by the tracker. ${esc(x.meta||"")}`;
    return `<div class="r sess">
      <div class="head" data-act="toggle" data-k="${attr(key)}">
        <span class="chev">${open?"▾":"▸"}</span>
        <span style="flex:1;min-width:0">
          <span class="ell" style="display:block;font-size:15px">${esc(x.title)}</span>
          <span class="ell muted" style="display:block;font-size:12px">${esc(x.meta||"")}</span>
        </span>
        <span class="tag tag-neutral" style="flex:none">${esc(x.tool)}</span>
        <span class="num" style="flex:none;width:88px;text-align:right;font-size:15px">${esc(fmt(x.burnMin||0))}</span>
        <span class="muted num" style="flex:none;width:52px;text-align:right;font-size:12px">${tot>0?Math.round((+x.burnMin||0)/tot*100)+"%":""}</span>
      </div>
      ${open?`<div class="body">
        <p style="margin:0 0 var(--s3);font-size:13.5px">${detail}</p>
        ${chips.length?`<div style="display:flex;gap:var(--s2);flex-wrap:wrap">${chips.map(c=>`<span class="tag tag-outline num">${esc(c)}</span>`).join("")}</div>`:""}
        <div style="margin-top:var(--s3);font-size:13.5px">${link}</div>
      </div>`:""}
    </div>`;
  }).join("");
  return head+`<div class="rowlist">${rows}</div>
    <p class="muted" style="margin:var(--s3) 0 0;font-size:12.5px">Tokens a minute per session, measured over the last ten minutes of log writes. The percentage is that session's share of what is burning right now.</p>`;
}

function renderToday(){
  const acts=buildActions();
  return setViewHTML("today", heroHTML() + (hasHistory()
    ? (`<div id="chartbox">${chartHTML()}</div>` + figsHTML() + reclaimHTML(acts) + ledgerHTML() + standingHTML(acts) + sessionsHTML())
    : sessionsHTML()));
}
</script>
<script>
/* ===========================================================================
   WHERE IT WENT
   ======================================================================== */
/* The heading is the exact chat title, as the app shows it. Cowork titles are
   the app's own sidebar names, re-resolved on every fetch, so a rename in the
   app shows here too. Claude Code and Codex chats have no user-set name, so
   their heading is the chat's own summary or opening request: still the exact
   text you would recognise the chat by, never a label we invented. */
function chatLabel(c){
  const t=String(c.title||"").replace(/\s+/g," ").trim();
  return t || (c.project||"(untitled chat)");
}
function chatSub(c){
  /* Windows select chats by LAST ACTIVITY, so that is the date shown first —
     a chat started in May but used yesterday belongs in "last 30 days". */
  const parts=[];
  if(c.tool) parts.push(c.tool+" chat");
  if(c.project && c.project!=="Cowork sessions") parts.push(c.project);
  const act=shortDate(c.lastActive||c.date);
  if(act) parts.push("last active "+act);
  const st=shortDate(String(c.when||"").slice(0,10));
  if(st && st!==act) parts.push("started "+st);
  if(c.titleSource!=="app") parts.push("no app title, this is its opening request");
  return parts.join(" · ");
}
function leaksNow(){ return (S.leaks && S.leaks.leaks) || null; }
/* How many chats the topShare percentage was computed over, and their subtotal. The server sends
   topN so a sentence can never name one count while the maths used another. */
function topN(lk){ const n=lk&&+lk.topN; return (n>0?n:Math.min(5,((lk&&lk.chats)||[]).length)); }
function topResent(lk){ return (((lk&&lk.chats)||[]).slice(0,topN(lk))).reduce((a,c)=>a+(+c.resent||0),0); }

/* An always-visible legend beats a hover tooltip. Native title tooltips are slow, invisible on
   touch, and were reported as simply not working. Plain sentences under the table instead. */
function columnLegend(){
  const N=[
   ["1","Re-sent",
    "&sum; cache_read_input_tokens over every assistant turn in the chat",
    "Every reply your tool logs records how many tokens it read back out of cache. That is the conversation so far, sent to the model again. Adding it up across the chat is this number. It is read from the log, not estimated, and it counts nothing you cannot verify: turns whose logs report no split are excluded and reported separately as unmeasured.",
    "A big number is not a problem by itself. Re-sent text grows with roughly the square of a chat&#39;s length, so a long chat is supposed to be large here. It is the raw size the other three columns judge."],
   ["2","Share",
    "this chat&#39;s re-sent &divide; all re-sent in this window",
    "How much of the window&#39;s re-sent text belongs to this one chat. Every chat in the window adds up to 100%.",
    "Work top down. A chat at 47% is where your money is; one at 0.2% is not worth opening."],
   ["3","Cached",
    "cache read &divide; (cache read + cache write + fresh input)",
    "How much of what went in came from cache instead of being charged at full price. Providers bill a cache read at roughly a tenth of fresh text.",
    "High is good here, unlike everything else on this page. A huge chat at 95% is cheap. A small chat at 40% is quietly expensive, because it keeps missing the cache and paying full rate."],
   ["4","Pushback",
    "count of your messages that open by correcting it",
    "The times you said no, that is wrong, or I already told you. Slash commands and tool output are not counted, and it only reads the start of a message, so it misses polite corrections.",
    "Three or more and the chat is going in circles: it guessed wrong early and everything since has been you arguing with that guess. Anthropic&#39;s own guidance is to start a fresh chat past two corrections rather than keep correcting. Zero does not mean the chat went well, only that nothing obvious was flagged."]
  ];
  return N.map(([n,name,formula,what,read])=>`<div class="fnote">
    <span class="n">${n}</span>
    <span><b>${name}</b> &nbsp;<span class="f">${formula}</span><br>${what} <i>${read}</i></span>
  </div>`).join("");
}

/* Cache hit ratio: the honest counterpart to raw size. Size says how BIG a chat is, which is
   mostly a question about how long it ran. This says how much of it was CHEAP. */
function cacheHitLine(lk){
  if(lk==null || lk.cacheHit==null) return "";
  const v=+lk.cacheHit;
  return `<p style="max-width:78ch;margin:var(--s4) 0 0;font-size:14px">Across this window, <b>${esc(v)}%</b> of everything sent in came from cache rather than being paid for at the full input rate${(+lk.freshInput>0)?`, against ${esc(fmt(lk.freshInput))} of fresh input`:""}. Higher is better here, unlike everything else on this page.</p>`;
}

/* Pushback count. Anthropic's own Claude Code guidance is the only vendor-published threshold
   in this area: correct it more than twice on the same issue and start fresh. So three is where
   the badge turns. Undercounts on purpose, see is_correction() in tracker.py. */
/* What each tool actually does, in one line, for the hover. Names come from the logs; anything
   unknown falls through to a generic line rather than an empty tooltip. */
const TOOL_DOC={
  Read:"Opens a file and reads it into the conversation. Cheap per call, but a big file becomes history that is re-sent on every later turn.",
  Write:"Creates or overwrites a whole file.",
  Edit:"Changes part of a file in place. Cheaper than rewriting the whole thing.",
  MultiEdit:"Several edits to one file in a single call.",
  NotebookEdit:"Edits a cell in a Jupyter notebook.",
  Bash:"Runs a shell command. Long output is the usual reason a chat suddenly gets expensive.",
  shell:"Runs a shell command. Long output is the usual reason a chat suddenly gets expensive.",
  Glob:"Finds files by name pattern. Very cheap.",
  Grep:"Searches inside files for text. Much cheaper than reading the files.",
  WebFetch:"Fetches one page and reads it. Whole pages land in the conversation and stay there.",
  WebSearch:"Searches the web and pulls back results.",
  Task:"Starts a sub-agent with its own context. Only its answer comes back, so it keeps big work out of this chat.",
  Agent:"Starts a sub-agent with its own context. Only its answer comes back, so it keeps big work out of this chat.",
  TodoWrite:"Updates the task list shown while it works.",
  TaskCreate:"Adds an item to the task list.",
  TaskUpdate:"Marks a task done or changes it.",
  Skill:"Loads a saved set of instructions for a particular kind of job.",
  SendUserFile:"Sends you a finished file.",
  Artifact:"Publishes a page you can open and share.",
  ExitPlanMode:"Finishes planning and asks you to approve before acting."
};
function toolDoc(name){
  if(TOOL_DOC[name]) return TOOL_DOC[name];
  if(String(name).indexOf("MCP")===0) return "A connected outside service. What it costs depends on how much it sends back.";
  return "A tool this chat called.";
}
function toolStrip(list){
  const t=(list||[]);
  if(!t.length) return "";
  const total=t.reduce((a,x)=>a+(+x[1]||0),0);
  return `<div class="tools" role="list" aria-label="Tools this chat called">`+
    t.map(([nm,n])=>`<span class="tl" role="listitem" data-tip="${attr(nm+" — called "+nfmt(n)+" time"+(n===1?"":"s")+" in this chat.\n\n"+toolDoc(nm))}">${esc(nm)} <b>${esc(nfmt(n))}</b></span>`).join("")+
    `</div><div class="muted" style="font-size:11px;margin-top:2px">${esc(nfmt(total))} tool call${total===1?"":"s"}${t.length>=6?" · scroll sideways for the rest":""}</div>`;
}

/* One tooltip element, delegated hover, positioned in viewport coordinates and clamped to the
   edges. Serves the tool chips, the stat labels and the footnote markers alike. */
(function(){
  let el=null;
  function box(){ if(!el){ el=document.createElement("div"); el.id="tt"; document.body.appendChild(el); } return el; }
  function show(t,x,y){
    const b=box(); b.textContent=t; b.classList.add("on");
    const r=b.getBoundingClientRect();
    let L=x+14, T=y+16;
    if(L+r.width>innerWidth-8) L=Math.max(8,x-r.width-14);
    if(T+r.height>innerHeight-8) T=Math.max(8,y-r.height-14);
    b.style.left=L+"px"; b.style.top=T+"px";
  }
  function hide(){ if(el) el.classList.remove("on"); }
  document.addEventListener("mouseover",function(e){
    const t=e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
    if(t) show(t.getAttribute("data-tip"), e.clientX, e.clientY); else hide();
  });
  document.addEventListener("mousemove",function(e){
    const t=e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
    if(t&&el&&el.classList.contains("on")) show(t.getAttribute("data-tip"), e.clientX, e.clientY);
  });
  document.addEventListener("scroll",hide,true);
  window.addEventListener("blur",hide);
})();

function corrBadge(n){
  const v=+n||0;
  if(v===0) return `<span class="muted" title="No obvious pushback in this chat.">0</span>`;
  const cls = v>=3 ? "tag-accent" : "tag-quiet";
  const tip = v>=3
    ? `You pushed back ${v} times in this chat. Anthropic's own guidance is that past two corrections on the same issue the context is cluttered with failed approaches, and a fresh chat beats continuing.`
    : `You pushed back ${v} time${v===1?"":"s"} in this chat. Under three, so nothing to act on.`;
  return `<span class="tag ${cls} num" title="${attr(tip)}">${esc(v)}</span>`;
}

function renderFixes(){

/* ===========================================================================
   CHECK A PROMPT — built for the laziest possible path: the box is focused on
   arrival, Cmd+Enter runs it, and the result leads with what to copy.
   ======================================================================== */
function renderCoach(){
  const c=S.coach;
  let results="";
  if(c&&c.ok){
    const chip=st=>st==="pass"?`<span class="tag tag-quiet">Pass</span>`
      : st==="mixed"?`<span class="tag tag-outline">Tighten</span>`
      : `<span class="tag tag-accent">Fix</span>`;
    const rows=(c.rubric||[]).filter(r=>r.status!=="na").map(r=>`
      <div class="r" style="padding:var(--s3) 0">
        <div style="display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;row-gap:var(--s1)">
          ${chip(r.status)}
          <span style="font-family:var(--font-heading);font-weight:600;font-size:16px">${esc(srv(r.name))}</span>
          <span class="faint" style="font-size:11.5px;margin-left:auto">${esc(srv(r.principle))}</span>
        </div>
        <p style="margin:var(--s1) 0 0;font-size:14px;max-width:74ch">${esc(srv(r.note))}</p>
        ${r.fix?`<p class="muted" style="margin:var(--s1) 0 0;font-size:13.5px;max-width:74ch"><b>Do:</b> ${esc(srv(r.fix))}</p>`:""}
      </div>`).join("");
    const skipped=(c.rubric||[]).filter(r=>r.status==="na").map(r=>srv(r.name));
    results=`<div style="margin-top:var(--s4);max-width:78ch">
      <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap">
        <span class="tag tag-outline num" style="font-size:14px;padding:5px 12px">Score ${esc(c.score)} of 100</span>
        <span style="font-size:15px">${esc(srv(c.verdict))}</span>
        <span class="muted num" style="font-size:12.5px;margin-left:auto">about ${esc(nfmt(c.estTokens))} tokens as written</span>
      </div>
      <div class="rowlist" style="margin-top:var(--s3)">${rows}</div>
      ${skipped.length?`<p class="faint" style="margin:var(--s2) 0 0;font-size:12px">Not relevant to this prompt: ${esc(skipped.join(", "))}.</p>`:""}
      ${(c.scaffold&&(c.scaffoldHasAdds||c.scaffold.indexOf("<")>=0))?`<div style="margin-top:var(--s4)">
        <div class="muted" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-ui);margin-bottom:var(--s1)">The tightened version — your prompt, plus only what is missing</div>
        <div class="cmdbox" style="font-family:var(--font-body);font-size:14px;white-space:pre-wrap;word-break:normal;line-height:1.5">${esc(c.scaffold)}</div>
        <div style="margin-top:var(--s2)"><button class="btn btn-primary" data-act="copy" data-copy="${attr(c.scaffold)}">Copy it</button>
        <span class="muted" style="font-size:12.5px;margin-left:var(--s2)">${(c.scaffold.match(/</g)||[]).length?"Fill anything in brackets, or delete it, and send.":"Copy and send."}</span></div>
      </div>`:""}
    </div>`;
  } else if(c&&!c.ok){
    results=`<p class="muted" style="margin-top:var(--s3);font-size:13.5px">${esc(srv(c.error||"Could not read it."))}</p>`;
  }
  return setViewHTML("coach",
    `<h6 class="muted">Before you spend the tokens</h6>
     <h1 style="margin:var(--s3) 0 0">Check a prompt</h1>
     <p style="max-width:64ch;margin:var(--s3) 0 var(--s6);font-size:16px">Paste what you are about to send. It grades the prompt on six things that decide what it will cost, quotes what needs work, and hands back a tightened version. It runs on this Mac; the prompt is not stored or sent anywhere.</p>
     <div style="max-width:78ch">
       <textarea class="input" id="coach-input" rows="7" style="font-size:15px" placeholder="Paste the prompt you are about to send…"></textarea>
       <div style="display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);flex-wrap:wrap">
         <button class="btn btn-primary" data-act="coachrun" ${S.coachBusy?"disabled":""} style="font-size:15px;padding:var(--s2) var(--s4)">${S.coachBusy?"Grading…":"Grade it"}</button>
         <span class="muted" style="font-size:12.5px">or press Cmd+Enter</span>
       </div>
       ${results}
     </div>
     <p class="muted" style="max-width:78ch;margin:var(--s8) 0 0;font-size:12px">Six of the eight dimensions implement the prompt issues Nate B Jones set out in <a class="linky" href="https://www.youtube.com/watch?v=KwQpPbLEBMA" target="_blank" rel="noopener">Here&#39;s How to Solve the 6 Top Prompt Issues&#39;</a> (6 Nov 2025): the projection trap, the cognitive bandwidth trap, the planning illusion, the confidence illusion, the revision loop and the drift problem. The output contract and verification are ours, not his. Each is weighted by what it costs when it goes wrong, against your own measured usage on this Mac. Analysis runs locally; the prompt is never stored or sent anywhere.</p>`);
}
